[package]
name = "peabiru-cli"
description = "Command-line tool of the peabiru routing engine: travel-time matrices, accessibility, isochrones, itineraries and fares on OpenStreetMap and GTFS, from CSV to CSV and GeoJSON"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://strategicprojects.github.io/peabiru-routing/rust/cli.html"
readme = "README.md"
keywords = ["routing", "gtfs", "openstreetmap", "accessibility", "cli"]
categories = ["command-line-utilities", "science::geo"]
# The integration tests run the binary on the sample data of the repository
# (r/inst/extdata/spo), which the published crate does not carry.
exclude = ["tests/"]

[[bin]]
name = "peabiru"
path = "src/main.rs"

[dependencies]
peabiru-core.workspace = true
# Argument parsing, help and usage errors.
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive", "wrap_help"] }
# `peabiru completions <shell>`.
clap_complete = "4.5"
# Ctrl-C cancels the computation through the core's CancelToken.
ctrlc = "~3.4"
# Reading GeoJSON scenarios (polygons of car speeds, lines of traffic stress).
serde_json = "1"

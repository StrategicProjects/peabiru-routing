[package]
name = "peabiru-cli"
description = "Command-line interface and benchmark driver for the peabiru routing engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# A test and benchmark tool for now: built from the repository, not published.
publish = false
keywords = ["routing", "gtfs", "openstreetmap", "accessibility", "cli"]
categories = ["command-line-utilities", "science::geo"]

[[bin]]
name = "peabiru"
path = "src/main.rs"

[dependencies]
peabiru-core.workspace = true

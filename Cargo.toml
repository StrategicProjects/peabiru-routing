[workspace]
resolver = "2"
members = ["crates/peabiru-core", "crates/peabiru-cli", "python"]
# `cargo build`/`cargo test` at the root skip the Python extension: it links
# against libpython and is built by maturin.
default-members = ["crates/peabiru-core", "crates/peabiru-cli"]
# The R package's crate is built by R CMD INSTALL with its own lockfile and
# vendored sources (CRAN builds offline), so it stays outside the workspace.
exclude = ["r"]

[workspace.package]
version = "0.1.5"
authors = [
    "André Leite <leite@castlab.org>",
    "Marcos Wasiliew <marcos.wasiliew@gmail.com>",
    "Hugo Vasconcelos <hugo.vasconcelos@ufpe.br>",
    "Carlos Amorim <carlos.agaf@ufpe.br>",
    "Diogo Bezerra <diogo.bezerra@ufpe.br>",
    "Júlia Nascimento Barreto <juliabarreto@gd.seplag.pe.gov.br>",
]
edition = "2021"
rust-version = "1.81"
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
repository = "https://github.com/StrategicProjects/peabiru-routing"
homepage = "https://strategicprojects.github.io/peabiru-routing/"

[workspace.dependencies]
peabiru-core = { path = "crates/peabiru-core", version = "0.1.5" }

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 2

<title id="title">Share of the population of Recife and Caruaru within 15 and 30 minutes of a school and a health unit</title>
<desc id="desc">Horizontal bars, one pair per mode and city, of the share of the population within 15 and within 30 minutes of the nearest public school, on the left, and of the nearest primary health care unit, on the right, walking, cycling and driving. In Recife nearly everyone is within 15 minutes' walk of a public school and three in four of a health unit; in Caruaru, whose municipality has a large rural area, fewer are, and the gap is largest for health units on foot. By car almost everyone is within 15 minutes of both.</desc>

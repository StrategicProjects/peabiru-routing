<title id="title">Travel time against fare budget for three trips in Porto Alegre</title>
<desc id="desc">Three step charts of the median travel time of the fastest trip within a fare budget, for three pairs of places in Porto Alegre. Along a corridor, one bus fare (R$ 4.80) brings the trip from 78 minutes on foot to 30 and a second ride saves a minute. Across town, one fare gives 89 minutes, most of them walking to a direct line, and the R$ 7.20 of two buses with the transfer discount gives 48. From Petrópolis to Teresópolis, each step still buys time: 90 minutes with one bus, 74 with two and 69 with three rides, at R$ 12.00.</desc>

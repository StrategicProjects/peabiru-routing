<svg role="img" aria-labelledby="title desc" xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='604.80pt' height='302.40pt' viewBox='0 0 604.8 302.4'>
<title id="title">Jobs within 60 minutes by public transport: peabiru with the feeds of 2026 against Ipea's estimates for 2019</title>
<desc id="desc">Three panels, one per city, each with two lines of the mean number of formal jobs reached within 60 minutes by public transport by income decile: computed here with the GTFS feeds of 2026, and published by Ipea's Access to Opportunities Project for 2019. In São Paulo the cell-by-cell correlation is 0.97. In Rio de Janeiro the cell-by-cell correlation is 0.90. In Belo Horizonte the cell-by-cell correlation is 0.91.</desc>

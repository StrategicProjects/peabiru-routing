# pkgdown site of the R package. Built by site/build.sh into _site/r/, next to
# the landing page (../), the Rust guide (../rust/), the Python docs
# (../python/) and the JavaScript guide (../js/). No `url:` on purpose: the site is not deployed yet, and every
# link between the sub-sites is relative.

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#b4532a"
    secondary: "#4a5a5f"
    success: "#2f6b4f"
    warning: "#c98a1d"
    font-family-sans-serif: "'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif"
    font-family-monospace: "ui-monospace, 'SF Mono', Menlo, Consolas, monospace"

development:
  mode: unreleased

home:
  title: "peabiru: multimodal routing in Rust for R"
  description: >
    Travel-time matrices and accessibility by walking, cycling, driving and
    public transport on OpenStreetMap and GTFS networks, computed by a Rust
    engine inside the R session, without Java.
  links:
  - text: peabiru home (all languages)
    href: ../index.html
  - text: Python docs
    href: ../python/index.html
  - text: JavaScript guide
    href: ../js/index.html
  - text: Rust guide
    href: ../rust/index.html
  - text: Benchmarks
    href: ../benchmarks.html

navbar:
  structure:
    left: [intro, reference, articles, benchmarks, news]
    right: [search, languages, home, github]
  components:
    languages:
      text: Other languages
      menu:
      - text: Python
        href: ../python/index.html
      - text: Rust
        href: ../rust/index.html
      - text: JavaScript
        href: ../js/index.html
    home:
      icon: fa-house
      href: ../index.html
      aria-label: peabiru home
    benchmarks:
      text: Benchmarks
      href: articles/benchmarks.html
    github:
      icon: fa-github
      href: https://github.com/StrategicProjects/peabiru-routing
      aria-label: Source on GitHub

reference:
- title: Networks
  desc: Build a network once from a directory with an OpenStreetMap `.pbf` and GTFS feeds.
  contents:
  - build_network
- title: Travel times
  desc: >
    Travel-time matrices by street or by public transport, summarised over the
    departure window or trip by trip.
  contents:
  - travel_time_matrix
  - expanded_travel_time_matrix
  - arrival_travel_time_matrix
- title: Accessibility
  contents:
  - accessibility
- title: Fares
  desc: >
    Fare structures (how much each ride and transfer costs), which the routing
    functions take, and the trade-off between travel time and fare.
  contents:
  - setup_fare_structure
  - read_fare_structure
  - write_fare_structure
  - pareto_frontier
- title: Isochrones and itineraries
  desc: >
    The areas or street segments reached from each origin within each
    cutoff, and the legs of each trip.
  contents:
  - isochrone
  - detailed_itineraries
- title: Trip options
  desc: >
    peabiru's own multi-criteria trip planner, with no r5r counterpart: every
    trip worth considering on time, fare, transfers and walking.
  contents:
  - trip_options
- title: Inspecting a network
  desc: >
    Where points snap, the street and transit networks as `sf`, the dates with
    service, and the errors gtfs-lib finds in the feeds.
  contents:
  - find_snap
  - street_network_bbox
  - street_network_to_sf
  - transit_network_to_sf
  - check_transit_availability
  - get_gtfs_errors
- title: Compatibility with r5r
  desc: >
    r5r's functions for Java and the R5 jar, kept so that r5r scripts run;
    peabiru needs neither.
  contents:
  - setup_r5
  - stop_r5
  - download_r5
  - r5r_cache
  - r5r_sitrep
- title: The package
  contents:
  - peabiru-package
  - core_version

articles:
- title: Using peabiru
  navbar: ~
  contents:
  - peabiru
  - articles/travel-time-matrices
  - articles/accessibility
  - articles/expanded-and-arrival
  - articles/itineraries
  - articles/fares
  - articles/trip-options
  - articles/elevation
  - articles/scenarios
  - articles/network-inspection
  - articles/coming-from-r5r
- title: Examples
  navbar: Examples
  contents:
  - articles/sf-tidyverse
  - articles/isochrones
  - articles/accessibility-map
  - articles/trips
  - articles/recife-caruaru
  - articles/terrain
  - articles/scenarios-porto-alegre
  - articles/helsinki
- title: Under the hood
  navbar: Under the hood
  contents:
  - articles/how-it-works
  - articles/benchmarks

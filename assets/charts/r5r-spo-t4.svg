  <title id="title">São Paulo: time and peak memory by task and engine, 4 threads</title>
  <desc id="desc">Small multiples, one block per task and one row per engine, fastest first, for São Paulo (323 points, all to all unless the row says otherwise) with 4 threads: left, median seconds of the timed runs; right, peak resident memory of the process; log scales; colour marks peabiru, the R5 family and other packages. Generated from benchmarks.json by bench/site/charts.py.</desc>

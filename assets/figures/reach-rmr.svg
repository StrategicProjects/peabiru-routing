<title id="title">Share of the population of the Recife metropolitan region within reach of Praça do Derby, by mode and travel time</title>
<desc id="desc">Four step curves of the share of the region's population reached from Praça do Derby within each number of minutes, from 0 to 120. Driving with free-flowing traffic reaches 84% within 30 minutes; walking plus public transport 53% within an hour and 91% within two; cycling 25% and 63%; walking 8% and 26%.</desc>

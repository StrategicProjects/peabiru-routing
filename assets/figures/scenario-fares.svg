<title id="title">Jobs reachable by public transport in Porto Alegre under three fare rules and two budgets</title>
<desc id="desc">Horizontal bars of the average number of jobs a resident of Porto Alegre reaches within 45 minutes by public transport, under the sample fare structure, with free transfers within the hour, and with no transfer discount, for a budget of one fare (R$ 4.80) and of R$ 7.20. With one fare to spend, only free transfers give the access of an unlimited budget; with R$ 7.20, the sample's discount on the second bus comes close to it.</desc>

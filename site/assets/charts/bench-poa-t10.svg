<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 874 924" width="874" height="924" role="img" aria-labelledby="title desc">
  <title id="title">Porto Alegre: time and peak memory by task and engine, 10 threads</title>
  <desc id="desc">Small multiples, one block per task and one row per engine, fastest first, for Porto Alegre (1227 points, all to all unless the row says otherwise) with 10 threads: left, median seconds of the timed runs; right, peak resident memory of the process; log scales; colour marks peabiru, the R5 family and other packages. Generated from benchmarks.json by bench/site/charts.py.</desc>

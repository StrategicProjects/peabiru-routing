    .panel { fill: #fffdf9; stroke: #e1d8c8; }
    .t { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2a2e; }
    .s { font-size: 12.5px; }

<title id="title">Percentiles of the travel time on a frequency-based network</title>
<desc id="desc">For 26 destinations in São Paulo, sorted by median travel time from one point, a range bar from the 5th to the 95th percentile of the travel times by walking and public transport over an hour of departures, a thicker bar from the 25th to the 75th, and a dot at the median. Destinations reached on foot have no spread; those reached by bus or metro spread by several minutes, mostly from waiting.</desc>

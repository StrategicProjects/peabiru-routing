<title id="title">Share of the population within reach of one origin, by mode and travel time</title>
<desc id="desc">Four step curves of the share of the population of the Porto Alegre grid reached from Farroupilha Park within each number of minutes, from 0 to 60. Driving rises fastest and reaches nearly everyone within about 20 minutes; walking plus public transport and cycling rise more slowly, and walking reaches the smallest share in an hour.</desc>

<title id="title">Average cycling time to the nearest health unit by traffic stress and slope, Salvador, Olinda and Recife</title>
<desc id="desc">Line charts, one per city, of the average cycling time from residents to the nearest primary health care unit as the highest level of traffic stress ridden goes from 1 to 4, on flat ground and with slopes: stress costs more than slope.</desc>

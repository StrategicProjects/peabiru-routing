<title id="title">Scheduled speed of buses, metro and VLT by hour of departure, Grande Recife</title>
<desc id="desc">Lines of the median scheduled speed of the trips of the feed by hour of departure on a weekday. Buses run at 24.8 kilometres per hour at 04:00, fall to 15.4 at 07:00, stay near 17.0 through the day, fall to 14.8 at 17:00 and recover to 22.7 at 22:00. The metro and the VLT keep the same speed all day.</desc>

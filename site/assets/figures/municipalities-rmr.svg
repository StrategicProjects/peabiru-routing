<title id="title">People within an hour by public transport, by municipality of the Recife metropolitan region</title>
<desc id="desc">A dot plot with one row per municipality of the Recife metropolitan region: the share of the region's residents that the average resident of the municipality reaches within 60 minutes on foot and with buses, metro and VLT, at the morning peak. Recife is first, with 25% of the region within an hour by public transport, and Araçoiaba last, with 0.4%.</desc>

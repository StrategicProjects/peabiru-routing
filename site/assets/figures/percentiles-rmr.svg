<svg role="img" aria-labelledby="title desc" xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='547.20pt' height='432.00pt' viewBox='0 0 547.2 432.0'>
<title id="title">Percentiles of the travel time by public transport from the integrated terminals of the Recife metropolitan region to Praça do Derby</title>
<desc id="desc">For each of the 26 integrated terminals of Grande Recife, sorted by median travel time to Praça do Derby at the morning peak, a range bar from the 5th to the 95th percentile of the travel times over an hour of departures, a thicker bar from the 25th to the 75th, and a dot at the median. Medians go from 13 minutes (TI Joana Bezerra) to 97 (TI Igarassu); the 5th and 95th percentiles are 4 to 26 minutes apart.</desc>

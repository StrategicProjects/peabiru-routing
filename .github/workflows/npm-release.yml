# Builds and tests the npm package and, when a GitHub release is published,
# uploads it to npm. The release tag must be "v" followed by the version in
# js/package.json, or the run stops before building; a release marked as a
# pre-release is built and tested but not uploaded.
#
# Run by hand (Actions > npm-release > Run workflow) it builds, tests and
# makes a dry run of the upload: nothing is published, unless the "publish"
# box is ticked, which uploads the version in js/package.json after the same
# approval in the npm environment (for a version whose release already exists).
#
# The upload uses npm's trusted publishing (OIDC), with no token. npm only
# lets a trusted publisher be set on a package that already exists, so the
# first version is published by hand (npm publish in js/, after sh build.sh);
# then, on npmjs.com (package peabiru > Settings > Trusted Publisher):
#   organization or user  StrategicProjects
#   repository            peabiru-routing
#   workflow filename     npm-release.yml
#   environment           npm
# Give the npm environment protection rules on GitHub (Settings >
# Environments > npm: required reviewers, and deployments only from tags
# v*), so that publishing a release cannot upload without an approval.
name: npm-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload js/package.json's version to npm (needs approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the tag with the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./js/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match js/package.json version $version"
            exit 1
          fi
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build
        run: sh js/build.sh
      - name: Test in Node
        working-directory: js
        run: node --test tests/*.test.mjs
      - name: Pack
        working-directory: js
        run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: js/peabiru-*.tgz
          if-no-files-found: error

  publish:
    name: upload to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ (github.event_name == 'release' || inputs.publish) && 'npm' || '' }}
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing (also signs provenance)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      # Node 24 bundles npm 11.13 or later, which has trusted publishing
      # (it needs 11.5.1). The npm of the runner image is not upgraded in
      # place: `npm install -g npm` fails there with EACCES on
      # /usr/local/share/man (ubuntu 26.04), and a self-upgrade loses the
      # bundled sigstore module that the provenance needs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or later (needed for trusted publishing)
        run: npm --version
      - name: Dry run
        if: (github.event_name != 'release' && !inputs.publish) || github.event.release.prerelease
        run: npm publish peabiru-*.tgz --access public --dry-run
      - name: Publish
        if: (github.event_name == 'release' && !github.event.release.prerelease) || inputs.publish
        run: npm publish peabiru-*.tgz --access public

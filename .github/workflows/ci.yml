name: CI

# The Rust core and command-line tool on the three platforms, the oldest
# supported compiler, the R package installed from the checkout, the Python
# package built as a wheel on Linux and tested with the oldest and newest
# supported Python, and the npm package built as WebAssembly and tested in
# Node. The wheels of every platform are built and tested by
# python-release.yml; nothing here publishes the npm package.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml selects stable with rustfmt and clippy; rustup,
      # already on the runners, installs it on the first cargo call
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Licence notices match the lockfiles
        # the crates' notices shipped in the packages and the copies of the
        # root licence files; regenerate with the script when this fails
        if: runner.os == 'Linux'
        run: python3 tools/third_party_notices.py --check
      - name: The R, Python and JavaScript pages list the same differences from r5r
        if: runner.os == 'Linux'
        run: python3 tools/check_differences.py
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --release --locked

  msrv:
    name: rust 1.81 (minimum supported)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.81 --profile minimal
      - run: cargo +1.81 check --locked -p peabiru-core -p peabiru-cli

  public-api:
    name: public API of peabiru-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the versions tools/public_api.sh names: the snapshot depends on how
      # this nightly's rustdoc describes the items
      - run: rustup toolchain install nightly-2026-11-08 --profile minimal
      - run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: The public API matches tools/public-api/peabiru-core.txt
        run: bash tools/public_api.sh

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the oldest and newest supported (pyproject.toml); ubuntu-24.04, not
        # ubuntu-latest: setup-python has no Python 3.9 for the newer image
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Lint the extension crate
        # the root's default members leave the Python crate out of the rust
        # job's clippy; PyO3 finds the interpreter set up above
        run: cargo clippy -p peabiru-python --all-targets --locked -- -D warnings
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          manylinux: auto
          args: --release --out dist
      - name: Install the test dependencies, then the wheel just built
        # the dependencies and the "test" extra of pyproject.toml; the wheel
        # comes from dist only, never from PyPI
        run: |
          python -m pip install "pandas>=1.5" "pytest>=7" "geopandas>=0.12"
          python -m pip install --no-index --find-links python/dist peabiru
      - name: Run the tests against the installed wheel
        # from the repository root, so that `import peabiru` finds the
        # installed wheel and not the source directory
        run: python -m pytest python/tests

  js:
    name: npm package (WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the toolchain of rust-toolchain.toml, with the WebAssembly target
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        # it fetches the wasm-bindgen matching js/Cargo.lock and wasm-opt
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Format and lint the bindings crate
        # js/ is outside the root workspace (own lockfile), so the rust
        # job's fmt and clippy do not see it
        run: |
          cargo fmt --manifest-path js/Cargo.toml --check
          cargo clippy --manifest-path js/Cargo.toml --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      - name: Build
        run: sh js/build.sh
      - name: Test in Node
        # the runner's Node (20 or later); the package needs 18 or later
        working-directory: js
        run: |
          node --version
          node --test tests/*.test.mjs
      - name: Examples and API reference of the JavaScript guide
        # the examples in Node and in the runner's Chrome (plain ES modules;
        # the Vite run needs VITE, not set here); the reference page must
        # match js/lib/index.d.ts
        run: |
          python3 site/js/gen_api.py --check
          node site/js/run_examples.mjs --require-browser

  r:
    name: R package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      # R on Windows links with the GNU toolchain of Rtools
      - name: Rust target for Rtools
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - name: Install testthat and the package's one dependency
        # tibble is the class of the tables returned by default (Imports);
        # sf, data.table and r5r are left out on purpose: the tests that
        # need them must skip
        run: install.packages(c("testthat", "tibble"))
        shell: Rscript {0}
      - name: Install the package from the checkout
        # bash: in PowerShell, R is an alias of Invoke-History
        shell: bash
        run: R CMD INSTALL r
      - name: Test
        run: |
          library(peabiru)
          r <- as.data.frame(testthat::test_dir(
            "r/tests/testthat", package = "peabiru", load_package = "installed",
            reporter = "summary", stop_on_failure = FALSE
          ))
          cat("passed:", sum(r$passed), "failed:", sum(r$failed),
              "errors:", sum(r$error), "skipped:", sum(r$skipped), "\n")
          if (sum(r$failed) > 0 || any(r$error)) quit(status = 1)
        shell: Rscript {0}

  r-cran:
    # The path of a CRAN submission, rehearsed: the source tarball of
    # tools/build_r_release.sh with the core of this commit in the place of
    # the published one (--local-core; never a tarball to submit), built
    # offline from the vendored crates, and R CMD check --as-cran on it.
    name: R package, CRAN tarball (rehearsal)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      # the vignette is built by R CMD build
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      - name: Install what the build and the check need
        # rextendr vendors the crates; sf, data.table and r5r (Suggests) are
        # left out, as in the r job: examples and tests must do without them
        run: install.packages(c("rextendr", "tibble", "testthat", "knitr", "rmarkdown"))
        shell: Rscript {0}
      - name: Build the tarball
        run: bash tools/build_r_release.sh "$RUNNER_TEMP/cran" --local-core
      - name: R CMD check --as-cran
        # no LaTeX on the runner (--no-manual); the incoming checks that ask
        # CRAN's servers are left out so that the job does not depend on them
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
          _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
        run: |
          cd "$RUNNER_TEMP/cran"
          R CMD check --as-cran --no-manual peabiru_*-LOCAL-CORE-NOT-FOR-CRAN.tar.gz
          log=peabiru.Rcheck/00check.log
          grep -n "offline\|^Using " peabiru.Rcheck/00install.out
          grep -q "cargo build -j 2 --offline" peabiru.Rcheck/00install.out ||
            { echo "the package was not built offline with two jobs"; exit 1; }
          grep "^Status: " "$log"
          if grep -Eq "^Status: .*(WARNING|ERROR)" "$log"; then
            echo "R CMD check gave a WARNING or an ERROR"; exit 1
          fi
      - name: The vendored sources build with the minimum supported Rust
        # the msrv job checks the core and the command-line tool; this is
        # what CRAN compiles (the R bindings, extendr, the vendored versions)
        run: |
          rustup toolchain install 1.81 --profile minimal
          bash tools/r_release_msrv.sh "$RUNNER_TEMP/cran/peabiru" "$RUNNER_TEMP/cran-msrv"
      - name: Check log
        if: always()
        run: cat "$RUNNER_TEMP/cran/peabiru.Rcheck/00check.log" || true

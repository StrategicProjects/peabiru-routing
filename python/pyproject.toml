[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "peabiru"
description = "Multimodal routing (OpenStreetMap + GTFS): travel-time matrices, accessibility and isochrones, with a Rust core"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "André Leite", email = "leite@castlab.org" }]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: GIS",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/StrategicProjects/peabiru-routing"

[tool.maturin]
module-name = "peabiru._peabiru"
python-source = "."
features = ["pyo3/extension-module"]
